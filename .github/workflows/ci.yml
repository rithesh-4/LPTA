name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja -y --no-progress
        shell: powershell

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1.8"

      - name: Configure
        run: cmake -S . -B build -G Ninja "-DLLVM_DIR=$LLVM_PATH/lib/cmake/llvm"

      - name: Build
        run: cmake --build build

      - name: Fast tests (unit + proof + cross-validation)
        run: |
          cd build && ctest --output-on-failure
        # Full suite (300-iteration fuzz) stays manual/scheduled:
        #   bash tests/run_all_tests.sh build/
