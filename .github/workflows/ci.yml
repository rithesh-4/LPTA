name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM and Ninja
        run: |
          choco install llvm ninja -y --no-progress --force
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      - name: Configure
        shell: bash
        run: |
          LLVM_CMAKE_DIR="$(llvm-config --cmakedir 2>/dev/null || echo 'C:/Program Files/LLVM/lib/cmake/llvm')"
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-cl \
            -DCMAKE_CXX_COMPILER=clang-cl \
            "-DLLVM_DIR=$LLVM_CMAKE_DIR"

      - name: Build
        run: cmake --build build

      - name: Fast tests (unit + proof + cross-validation)
        run: |
          export LLVM_DIR="C:/Program Files/LLVM"
          export PATH="$LLVM_DIR/bin:$PATH"
          cd build && ctest --output-on-failure
        # Full suite (300-iteration fuzz) stays manual/scheduled:
        #   bash tests/run_all_tests.sh build/
