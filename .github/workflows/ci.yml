name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzstd-dev libedit-dev libcurl4-openssl-dev ninja-build

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1.8"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DLLVM_DIR="$LLVM_PATH/lib/cmake/llvm" -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang

      - name: Build
        run: cmake --build build

      - name: Fast tests (unit + proof + cross-validation)
        run: |
          cd build && ctest --output-on-failure
        # Full suite (300-iteration fuzz) stays manual/scheduled:
        #   bash tests/run_all_tests.sh build/
